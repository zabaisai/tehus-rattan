<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKTO — Motion TAK→TO</title>
<link rel="stylesheet" href="takto-motion.css">
<style>
 body{margin:0;font-family:'IBM Plex Sans',Arial,sans-serif;background:#F7F8FA;color:#171B24;
  display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:28px}
 .stage{background:#fff;border:1px solid #E2E5EC;border-radius:14px;padding:48px 64px;box-shadow:0 4px 12px rgba(19,28,74,.10)}
 .takto-logo{font-size:72px;line-height:1}
 button{font:inherit;font-weight:600;background:#131C4A;color:#fff;border:0;border-radius:6px;padding:10px 18px;cursor:pointer}
 small{color:#525A6B}
</style></head><body>
 <div class="stage"><span class="takto-logo" id="logo"><span class="takto-tak">TAK</span><span class="takto-to">TO</span></span></div>
 <button onclick="const l=document.getElementById('logo');const c=l.cloneNode(true);l.replaceWith(c);c.id='logo';">Repetir animacion</button>
 <small>Secuencia: TAK (navy) &rarr; TO (naranja). Con prefers-reduced-motion: aparece completo, sin movimiento.</small>
 <div class="stage" style="background:#131C4A"><img src="takto-logo-motion.svg" width="360" alt="TAKTO motion (SVG)"></div>
</body></html>
