name: tehus-crm-staging

# All application secrets/config come from .env.staging (see
# deploy/env/staging.env.example for the documented template). Build args for
# the frontend need the same values available in the *shell* environment —
# use `docker compose --env-file .env.staging -f docker-compose.staging.yml ...`
# (deploy.sh does this) so ${NEXT_PUBLIC_API_URL} resolves for the build step
# below, not just inside the running containers.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.staging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Intentionally no `ports:` — Postgres is reachable only from the
    # `internal` network (backend), never published to the host/internet.

  # Cola durable para automatizaciones diferidas, reintentos y esperas.
  #
  # Redis NO es fuente de verdad: el estado durable vive en PostgreSQL. Redis
  # solo transporta trabajos, de modo que perderlo degrada el procesamiento
  # asíncrono pero nunca los datos comerciales.
  #
  # Sin `ports:` — igual que PostgreSQL, solo alcanzable desde la red
  # `internal`, nunca publicado al host ni a Internet. Por eso no lleva
  # contraseña: añadir un secreto que solo viaja por una red privada de Docker
  # da una falsa sensación de seguridad sin cerrar ningún vector real. Si
  # algún día Redis se expone, la contraseña pasa a ser obligatoria.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: los trabajos en vuelo sobreviven a un reinicio del contenedor.
    # maxmemory-policy noeviction: una cola NUNCA debe descartar trabajos en
    # silencio por presión de memoria; es preferible que falle de forma visible.
    command: >-
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    # tini as PID 1 so SIGTERM is forwarded to Node and zombies are reaped;
    # give in-flight requests + Prisma disconnect time to finish on stop.
    init: true
    stop_grace_period: 30s
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Intentionally no `ports:` — reachable only through Caddy on the
    # `proxy` network, never published directly to the host/internet.

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # Public Meta Embedded Signup identifiers, inlined into the client
        # bundle at build time (never the app secret). Empty => the "Conectar
        # con Meta" button is present but the flow reports "no disponible".
        NEXT_PUBLIC_WHATSAPP_APP_ID: ${NEXT_PUBLIC_WHATSAPP_APP_ID:-}
        NEXT_PUBLIC_WHATSAPP_CONFIG_ID: ${NEXT_PUBLIC_WHATSAPP_CONFIG_ID:-}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Intentionally no `ports:` — reachable only through Caddy.

  # Worker de la cola durable. Proceso SEPARADO del backend a proposito:
  #
  #  - un job pesado (descargar un medio, ejecutar una automatizacion larga)
  #    no puede robarle CPU al hilo que atiende webhooks de Meta, que exigen
  #    un ack rapido;
  #  - se puede reiniciar o escalar sin cortar la API;
  #  - un fallo del worker degrada el procesamiento diferido, no el CRM.
  #
  # Comparte imagen con el backend (mismo codigo, distinto arranque) para que
  # no puedan divergir de version.
  worker:
    image: tehus-crm-staging-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    # Mas margen que el backend: un job en vuelo debe poder terminar antes de
    # que lo maten, o se reintentara y podria duplicar efectos.
    command: ["node", "dist/src/worker"]
    env_file:
      - .env.staging
    environment:
      WORKER_ROLE: "queue"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Sin healthcheck HTTP: no expone puerto. Su salud se observa por la cola
    # (jobs atascados) y por el log, no por un endpoint inventado.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    depends_on:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  caddy_data:
  caddy_config:
