name: tehus-crm-staging

# All application secrets/config come from .env.staging (see
# deploy/env/staging.env.example for the documented template). Build args for
# the frontend need the same values available in the *shell* environment —
# use `docker compose --env-file .env.staging -f docker-compose.staging.yml ...`
# (deploy.sh does this) so ${NEXT_PUBLIC_API_URL} resolves for the build step
# below, not just inside the running containers.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.staging
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Intentionally no `ports:` — Postgres is reachable only from the
    # `internal` network (backend), never published to the host/internet.

  # Cola durable para automatizaciones diferidas, reintentos y esperas.
  #
  # Redis NO es fuente de verdad: el estado durable vive en PostgreSQL. Redis
  # solo transporta trabajos, de modo que perderlo degrada el procesamiento
  # asíncrono pero nunca los datos comerciales.
  #
  # Sin `ports:` — igual que PostgreSQL, solo alcanzable desde la red
  # `internal`, nunca publicado al host ni a Internet. Por eso no lleva
  # contraseña: añadir un secreto que solo viaja por una red privada de Docker
  # da una falsa sensación de seguridad sin cerrar ningún vector real. Si
  # algún día Redis se expone, la contraseña pasa a ser obligatoria.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # appendonly: los trabajos en vuelo sobreviven a un reinicio del contenedor.
    # maxmemory-policy noeviction: una cola NUNCA debe descartar trabajos en
    # silencio por presión de memoria; es preferible que falle de forma visible.
    command: >-
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    # tini as PID 1 so SIGTERM is forwarded to Node and zombies are reaped;
    # give in-flight requests + Prisma disconnect time to finish on stop.
    init: true
    stop_grace_period: 30s
    env_file:
      - .env.staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      # Mismo volumen y MISMA ruta que el worker: es lo unico que hace que el
      # archivo subido aqui se pueda leer alli.
      - product_imports:/var/lib/takto/importaciones
    environment:
      PRODUCT_IMPORT_STORAGE_DIR: /var/lib/takto/importaciones
    networks:
      - internal
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Intentionally no `ports:` — reachable only through Caddy on the
    # `proxy` network, never published directly to the host/internet.

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        # `:-` (vacío por defecto): así `docker compose` invocado sin
        # `--env-file` (health check, backup) no avisa de variable no definida.
        # No es una puerta a construir mal: `next build` en producción FALLA
        # de forma explícita si la URL está vacía (apps/frontend/src/lib/build-guard.ts).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        # Public Meta Embedded Signup identifiers, inlined into the client
        # bundle at build time (never the app secret). Empty => the "Conectar
        # con Meta" button is present but the flow reports "no disponible".
        NEXT_PUBLIC_WHATSAPP_APP_ID: ${NEXT_PUBLIC_WHATSAPP_APP_ID:-}
        NEXT_PUBLIC_WHATSAPP_CONFIG_ID: ${NEXT_PUBLIC_WHATSAPP_CONFIG_ID:-}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Intentionally no `ports:` — reachable only through Caddy.

  # Worker de la cola durable. Proceso SEPARADO del backend a proposito:
  #
  #  - un job pesado (descargar un medio, ejecutar una automatizacion larga)
  #    no puede robarle CPU al hilo que atiende webhooks de Meta, que exigen
  #    un ack rapido;
  #  - se puede reiniciar o escalar sin cortar la API;
  #  - un fallo del worker degrada el procesamiento diferido, no el CRM.
  #
  # Comparte imagen con el backend (mismo codigo, distinto arranque) para que
  # no puedan divergir de version.
  worker:
    image: tehus-crm-staging-backend
    restart: unless-stopped
    init: true
    stop_grace_period: 60s
    # Mas margen que el backend: un job en vuelo debe poder terminar antes de
    # que lo maten, o se reintentara y podria duplicar efectos.
    command: ["node", "dist/src/worker"]
    env_file:
      - .env.staging
    environment:
      WORKER_ROLE: "queue"
      # MISMA ruta que el backend. Si estas dos difieren, el worker vuelve a no
      # encontrar el archivo y la importacion muere igual que en staging.
      PRODUCT_IMPORT_STORAGE_DIR: /var/lib/takto/importaciones
    # Healthcheck PROPIO. Sin esto hereda el de la imagen del backend, que
    # consulta `http://127.0.0.1:3001/api/health` — y el worker no expone HTTP
    # por diseño, asi que figuraba `unhealthy` estando perfectamente vivo.
    # Docker no lo reiniciaba (`restart: unless-stopped` no actua sobre la
    # salud), pero quien mirase la monitorizacion leia lo contrario de la
    # verdad.
    #
    # Comprueba la marca que el propio proceso refresca en cada latido: mide
    # que ESTE proceso sigue vivo y su temporizador corriendo, sin abrir una
    # conexion a la base en cada sondeo y sin marcar enfermo al worker porque
    # PostgreSQL parpadee.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const fs=require('fs');
          const f=process.env.WORKER_HEARTBEAT_FILE||'/tmp/worker-heartbeat';
          const edad=Date.now()-fs.statSync(f).mtimeMs;
          if(edad>75000){console.error('latido viejo: '+edad+'ms');process.exit(1)}
      interval: 30s
      timeout: 5s
      retries: 3
      # El primer latido se escribe al arrancar, pero el arranque de Nest tarda:
      # este margen evita un `unhealthy` inicial que no significa nada.
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - backend_uploads:/app/uploads
      # El MISMO volumen y la MISMA ruta que el backend: aqui se LEE lo que
      # aquel escribio.
      - product_imports:/var/lib/takto/importaciones
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Sin healthcheck HTTP: no expone puerto. Su salud se observa por la cola
    # (jobs atascados) y por el log, no por un endpoint inventado.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    depends_on:
      - backend
      - frontend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  proxy:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  # EL ARCHIVO DE UNA IMPORTACION LO ESCRIBE EL BACKEND Y LO LEE EL WORKER.
  #
  # Antes vivia en el `/tmp` de cada contenedor, que son sistemas de archivos
  # distintos: el worker no encontraba nunca lo que subia el backend y toda
  # importacion moria con «El archivo temporal ya no existe» y cero filas.
  #
  # Este volumen se monta en la MISMA ruta en backend y worker, y en ningun
  # otro servicio: ni frontend, ni postgres, ni caddy, ni redis lo necesitan.
  product_imports:
  caddy_data:
  caddy_config:
