name: CI

# Verification only — NO deploy, no secrets, no Meta/WhatsApp calls. Runs the
# same commands used locally so a green CI means the branch builds and its tests
# pass. All values below are dummy/fictitious and safe to commit.
on:
  push:
    # develop/main plus any feature/** branch, so a branch is verified remotely
    # before it is ever merged (there may be no PR yet).
    branches: [develop, main, "feature/**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend (test / lint / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck (incluye tests)
        run: npm run typecheck
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Dummy build-time public API URL (inlined into the bundle). Not a secret.
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  backend:
    name: Backend (validate / test / build / e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # All dummy/fictitious — safe to commit, never real credentials.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
      JWT_SECRET: ci-dummy-jwt-secret-not-a-real-value
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma validate
        run: npx prisma validate
      # Comprueba TAMBIEN los ficheros de prueba, que `npm run build` no ve:
      # usa tsconfig.build.json, que los excluye. Sin este paso, un spec que
      # instancia un servicio con menos argumentos de los que pide su
      # constructor pasa el CI sin que nadie se entere — y esa desalineacion
      # ha llegado a dejar mocks DESPLAZADOS, con la cola ocupando la posicion
      # de las notificaciones y las pruebas pasando igualmente.
      - name: Typecheck (incluye specs)
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Apply migrations (isolated CI database)
        run: npx prisma migrate deploy
      - name: E2E tests
        run: npm run test:e2e -- --runInBand
