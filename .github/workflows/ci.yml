name: CI

# Verification only — NO deploy, no secrets, no Meta/WhatsApp calls. Runs the
# same commands used locally so a green CI means the branch builds and its tests
# pass. All values below are dummy/fictitious and safe to commit.
on:
  push:
    # develop/main plus any feature/** or hotfix/** branch, so a branch is
    # verified remotely before it is ever merged (there may be no PR yet).
    #
    # `hotfix/**` se anadio despues de que una rama de correccion urgente se
    # quedara SIN verificar por no encajar en el patron: precisamente la clase
    # de rama que mas prisa lleva y que menos conviene fusionar a ciegas.
    branches: [develop, main, "feature/**", "hotfix/**"]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  frontend:
    name: Frontend (test / lint / build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Typecheck (incluye tests)
        run: npm run typecheck
      - run: npm run lint
      - name: Build
        run: npm run build
        env:
          # Dummy build-time public API URL (inlined into the bundle). Not a secret.
          NEXT_PUBLIC_API_URL: http://localhost:3001/api

  backend:
    name: Backend (validate / test / build / e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: ci_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Las E2E de FlowBot que prueban el contador de frecuencia y el circuit
      # breaker necesitan Redis DE VERDAD: lo que comprueban —que dos workers
      # concurrentes no se cuelen, que un script Lua sea atomico, que en
      # HALF_OPEN pase una sola prueba— depende de como ejecuta Redis, y un
      # doble contestaria que si a todo.
      #
      # Sin este servicio, esas dos suites fallaban (47 tests) y ademas dejaban
      # sockets reintentando: Jest terminaba en ~163 s, no podia salir, y
      # GitHub cancelaba el job a los 25 minutos.
      redis:
        # Version fijada: un `redis:alpine` flotante cambia de version mayor sin
        # avisar y las pruebas de Lua dejarian de significar lo mismo.
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # All dummy/fictitious — safe to commit, never real credentials.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_db
      JWT_SECRET: ci-dummy-jwt-secret-not-a-real-value
      NODE_ENV: test
      # El job corre SOBRE el runner (no dentro de un contenedor) y los
      # servicios publican sus puertos, asi que se llega a ellos por
      # `127.0.0.1`. Si algun dia este job pasara a `container:`, habria que
      # cambiarlo por el nombre del servicio (`redis`), que es como se resuelve
      # dentro de la red de Docker.
      #
      # Se pone EXPLICITO en vez de confiar en el valor por defecto de
      # `buildRedisConnection`, que apunta a `redis` porque esta pensado para
      # docker-compose local.
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      # ── FlowBot: todo apagado, explicito ────────────────────────────────
      # Son los valores por defecto del codigo; se escriben igual para que el
      # CI no dependa de que ese defecto siga siendo el mismo manana. Con esto,
      # ninguna prueba puede mandar un WhatsApp aunque alguien se equivoque.
      FLOWBOT_REAL_WHATSAPP_ENABLED: "false"
      FLOWBOT_WHATSAPP_DRY_RUN: "true"
      FLOWBOT_WHATSAPP_COMPANY_ALLOWLIST: ""
      FLOWBOT_WHATSAPP_PHONE_ALLOWLIST: ""
      FLOWBOT_WHATSAPP_RECIPIENT_ALLOWLIST: ""
      # Clave de cifrado FICTICIA, solo para que el servicio arranque en las
      # pruebas. No descifra ningun token real porque no hay ninguno.
      WHATSAPP_TOKEN_ENCRYPTION_KEY: ci-dummy-encryption-key-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - run: npm ci
      - name: Prisma generate
        run: npx prisma generate
      - name: Prisma validate
        run: npx prisma validate
      # Comprueba TAMBIEN los ficheros de prueba, que `npm run build` no ve:
      # usa tsconfig.build.json, que los excluye. Sin este paso, un spec que
      # instancia un servicio con menos argumentos de los que pide su
      # constructor pasa el CI sin que nadie se entere — y esa desalineacion
      # ha llegado a dejar mocks DESPLAZADOS, con la cola ocupando la posicion
      # de las notificaciones y las pruebas pasando igualmente.
      - name: Typecheck (incluye specs)
        run: npm run typecheck
      # El backend no pasaba lint en CI y habia acumulado 31 errores, dos de
      # ellos de comportamiento: `String(unknown)` mandando "[object Object]"
      # a un cliente por WhatsApp y al nombre de un producto importado.
      # `--no-fix` a proposito: en CI se comprueba, no se reescribe.
      - name: Lint
        run: npx eslint "{src,apps,libs,test}/**/*.ts" --no-fix
      - name: Unit tests
        run: npm test -- --runInBand
      - name: Build
        run: npm run build
      - name: Apply migrations (isolated CI database)
        run: npx prisma migrate deploy
      # Comprobacion previa con timeout corto. Sin ella, un Redis ausente se
      # manifestaba como 47 tests rojos y un proceso que no terminaba, y el job
      # moria por el limite de 25 minutos: el sintoma no se parecia en nada a
      # la causa. Asi el fallo llega en segundos y dice que pasa.
      - name: Redis reachable (gate)
        timeout-minutes: 1
        run: |
          set -e
          echo "Comprobando Redis en ${REDIS_HOST}:${REDIS_PORT}..."
          for i in $(seq 1 20); do
            if (echo > /dev/tcp/${REDIS_HOST}/${REDIS_PORT}) 2>/dev/null; then
              echo "Redis responde."
              exit 0
            fi
            sleep 1
          done
          echo "::error::Redis NO responde en ${REDIS_HOST}:${REDIS_PORT}."
          echo "Las E2E de FlowBot (contador de frecuencia y circuit breaker)"
          echo "necesitan Redis de verdad. Revisa el servicio 'redis' del job."
          exit 1
      - name: E2E tests
        run: npm run test:e2e -- --runInBand
        env:
          # Solo para las E2E, NO para todo el job. Varias unitarias comprueban
          # el comportamiento por defecto de la cola leyendo `process.env` en
          # tiempo de ejecucion, y ponerlo a nivel de job las rompia: 14 tests
          # en 4 suites. Lo descubrio reproducir el job entero en local en vez
          # de solo el paso de E2E.
          #
          # Aqui si hace falta: con el consumidor encendido, un worker de BullMQ
          # quedaria vivo al terminar y Jest no podria salir.
          QUEUE_ENABLED: "false"

