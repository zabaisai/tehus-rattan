name: Backup safety

on:
  pull_request:
    paths:
      - "deploy/scripts/backup-*.sh"
      - "deploy/scripts/restore-postgres.sh"
      - "deploy/scripts/install-backup-systemd.sh"
      - "deploy/systemd/**"
      - "deploy/env/backup.env.example"
      - "deploy/tests/backup-safety.test.sh"
      - ".github/workflows/backup-safety.yml"
  push:
    branches: [main]
    paths:
      - "deploy/scripts/backup-*.sh"
      - "deploy/scripts/restore-postgres.sh"
      - "deploy/scripts/install-backup-systemd.sh"
      - "deploy/systemd/**"
      - "deploy/env/backup.env.example"
      - "deploy/tests/backup-safety.test.sh"
      - ".github/workflows/backup-safety.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate backup scripts and policy invariants
        run: bash deploy/tests/backup-safety.test.sh
