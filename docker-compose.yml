version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: tehus_postgres
    restart: always
    environment:
      POSTGRES_USER: tehus_user
      POSTGRES_PASSWORD: tehus_pass
      POSTGRES_DB: tehus_rattan
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: tehus_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@tehus.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # Paridad con staging: la cola durable tambien en desarrollo, para que un
  # comportamiento que dependa de Redis no aparezca solo al desplegar.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server
      --appendonly yes
      --maxmemory-policy noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data_dev:
